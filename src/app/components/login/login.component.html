<h2 >Login</h2>
<mat-form-field class="login-form-field" appearance="fill">
    <label>Please Enter Test User Id</label>
    <input matInput type="text" value="{{userId}}" [(ngModel)]="userId">
    <button *ngIf="userId"  (click)="clearUserId()">
        <mat-icon class="red-icon">cancel</mat-icon>
    </button>
    <button *ngIf="userId"  (click)="validateAndLogin()">
        <mat-icon class="green-icon">check</mat-icon>
    </button>
</mat-form-field>
